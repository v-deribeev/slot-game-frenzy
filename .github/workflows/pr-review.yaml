name: Slot CI & Gemini AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Build (TS + SCSS)
        run: npm run build

      - name: Run 181 Vitest Unit & 1,000-Spin Stress Tests
        run: npm run test

      - name: Cross-Model AI PR Review (Gemini 2.5 Flash)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Get the PR diff (excluding lockfiles) and project rules
          git diff origin/${{ github.base_ref }}...HEAD -- . ':(exclude)package-lock.json' | head -c 60000 > pr_diff.txt

          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const diff = fs.readFileSync("pr_diff.txt", "utf8");
            const rules = fs.existsSync("CLAUDE.md") ? fs.readFileSync("CLAUDE.md", "utf8") : "";

            async function review() {
              const prompt = `You are a Principal Slot Game Engine Reviewer performing an independent cross-model review of a PR generated by Claude.\n\nProject Rules (CLAUDE.md):\n${rules}\n\nPR Diff:\n${diff}\n\nProvide a concise, high-signal Senior Code Review covering:\n1. Finite State Machine & Race Condition safety\n2. 60 FPS Render Loop & Garbage Collection / Memory leaks\n3. Slot Math / RTP & Edge Cases\n4. Concrete Verdict (Approve or Request Changes).`;

              const res = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                }
              );
              const data = await res.json();
              const reviewBody = data.candidates?.[0]?.content?.parts?.[0]?.text || "AI review failed to generate.";
              fs.writeFileSync("review_comment.md", "## 🤖 Gemini Cross-Model PR Review\n\n" + reviewBody);
              execSync(`gh pr comment ${process.env.PR_NUMBER} --repo ${process.env.REPO} --body-file review_comment.md`);
            }
            review();
          '
